<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)" stroke="url(#accent)" stroke-width="4"/>

  <!-- Wi-Fi waves (three arcs) -->
  <g fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round" filter="url(#glow)">
    <!-- Outer wave -->
    <path d="M 130 310 Q 256 120 382 310" opacity="0.4"/>
    <!-- Middle wave -->
    <path d="M 170 300 Q 256 170 342 300" opacity="0.7"/>
    <!-- Inner wave -->
    <path d="M 210 290 Q 256 210 302 290" opacity="1"/>
  </g>

  <!-- Lightning bolt (center) -->
  <path d="M 270 200 L 240 265 L 268 265 L 242 340 L 290 255 L 262 255 L 290 200 Z"
        fill="url(#accent)" filter="url(#glow)"/>

  <!-- Dot at bottom center -->
  <circle cx="256" cy="340" r="14" fill="url(#accent)" filter="url(#glow)"/>
</svg>
