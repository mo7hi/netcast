<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  NetCast D-Bus system bus policy
  BSD-2-Clause License

  Allows the netcast user to own the service name.
  Allows any user in the netdev group (or active session) to call methods.
-->
<busconfig>
  <!-- Only the netcast daemon user can own this bus name -->
  <policy user="netcast">
    <allow own="net.netcast.Daemon"/>
  </policy>

  <!-- Allow root to call all methods (for CLI run as root) -->
  <policy user="root">
    <allow send_destination="net.netcast.Daemon"/>
    <allow receive_sender="net.netcast.Daemon"/>
  </policy>

  <!-- Allow users in netdev group to call methods -->
  <policy group="netdev">
    <allow send_destination="net.netcast.Daemon"/>
    <allow receive_sender="net.netcast.Daemon"/>
  </policy>

  <!-- Default: deny all other access -->
  <policy context="default">
    <deny send_destination="net.netcast.Daemon"/>
  </policy>
</busconfig>
