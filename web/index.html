<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="NetCast: share any internet connection as a Wi-Fi hotspot." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f3f5f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e1310" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>NetCast</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <script>
    // Apply the saved theme before first paint so there is no flash.
    try { document.documentElement.dataset.theme = localStorage.getItem('netcast-theme') || 'system'; } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
